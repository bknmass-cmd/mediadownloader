name: Build SnapVid Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SnapVid APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Angular Frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > frontend/android/local.properties
          cat frontend/android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          mkdir -p ../../dist-apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../../dist-apk/SnapVid-debug.apk \;
          ls -la ../../dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapVid-APK
          path: dist-apk/SnapVid-debug.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SnapVid Android APK v1.0.0
          files: dist-apk/SnapVid-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
